# Render Blueprint for the AgentEco API (docs/DEPLOY.md, "A free route for the api only").
# Public settings only. The secrets are asked for in the Render dashboard (sync: false) and are never stored here.
services:
  - type: web
    name: agenteco-api
    runtime: node
    plan: free
    # No rootDir: the backend imports ../agent-runtime, so the whole repository is needed and both are installed.
    buildCommand: cd backend && npm install --include=dev && npm install --prefix ../agent-runtime --omit=dev --no-audit --no-fund
    startCommand: cd backend && npm run start:api
    healthCheckPath: /health
    envVars:
      - key: NODE_VERSION
        value: 22.12.0
      # The new database (docs/DEPLOY.md section 1).
      - key: DATABASE_URL
        sync: false
      - key: DIRECT_URL
        sync: false
      # Long random secret; never change it afterwards (hosted agents' keys are encrypted with it).
      - key: AGENT_KEY_ENCRYPTION_SECRET
        sync: false
      # Comma-separated origins of the website: https://agenteco.web.id,https://www.agenteco.web.id,https://agenteco-multichain.vercel.app
      - key: FRONTEND_ORIGIN
        sync: false
      # This API's own public URL, once Render has given it one.
      - key: PUBLIC_API_URL
        sync: false
      - key: CHAINS
        value: bsc-testnet,base-sepolia,ethereum-sepolia,arbitrum-sepolia,tempo-moderato,bot-testnet,solana-devnet
      - key: AGENT_ECO_ADDRESS__eip155_84532
