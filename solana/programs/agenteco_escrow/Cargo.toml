[package]
name = "agenteco_escrow"
version = "0.1.0"
edition = "2021"

[lib]
crate-type = ["cdylib", "lib"]
name = "agenteco_escrow"

[features]
no-entrypoint = []
cpi = ["no-entrypoint"]
default = []
custom-heap = []
custom-panic = []
anchor-debug = []
no-log-ix-name = []
idl-build = ["anchor-lang/idl-build", "anchor-spl/idl-build"]

[dependencies]
anchor-lang = { git = "https://github.com/otter-sec/anchor", tag = "v1.2.1", features = ["init-if-needed"] }
anchor-spl = { git = "https://github.com/otter-sec/anchor", tag = "v1.2.1" }

[dev-dependencies]
litesvm = "0.18"
solana-sdk = "4"
spl-token = { version = "9", features = ["no-entrypoint"] }
spl-associated-token-account = { version = "7", features = ["no-entrypoint"] }
sha2 = "0.10"
base64 = "0.22"
