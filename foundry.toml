# Foundry project for the AgentEco contracts (BSC Testnet deployment).
# Same compiler settings as the original BOT Chain build: 0.8.34, cancun, optimizer 200, viaIR off.
[profile.default]
src = "contracts"
test = "test"
script = "script"
out = "out"
libs = ["lib"]
solc = "0.8.34"
evm_version = "cancun"
optimizer = true
optimizer_runs = 200
via_ir = false
remappings = [
  "@openzeppelin/contracts/=lib/openzeppelin-contracts/contracts/",
  "forge-std/=lib/forge-std/src/",
]
fs_permissions = [{ access = "read", path = "./" }]

[fuzz]
runs = 512

[invariant]
runs = 128
depth = 64

[rpc_endpoints]
bsc_testnet = "${BSC_TESTNET_RPC_URL}"
base_sepolia = "${BASE_SEPOLIA_RPC_URL}"

# BscScan verification uses an Etherscan V2 API key, passed on the command line:
#   forge verify-contract <addr> <path:Name> --chain 97 --etherscan-api-key $ETHERSCAN_API_KEY
